[project]
name = "lifeline-api"
version = "0.1.0"
description = "LiFEline - Mission LiFE citizen engagement API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "anthropic>=1.0",
    "pillow>=11",
    "pywebpush>=2.0",
    "fpdf2>=2.9.0",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
