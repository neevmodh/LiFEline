name: Push alerts

# Every 15 minutes: ask the API to send any Green Hours or evening-peak alerts that are due.
# GitHub may delay scheduled runs by a few minutes; alerts are deduplicated per day.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due alerts
        env:
          API_URL: ${{ secrets.API_URL }}
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$PUSH_CRON_SECRET" ]; then echo "Alerts not configured yet"; exit 0; fi
          # The free Render plan sleeps; the first request may take a minute to wake it.
          curl -fsS --retry 3 --retry-delay 20 --max-time 120 -X POST "$API_URL/api/internal/push/run" \
            -H "X-Cron-Secret: $PUSH_CRON_SECRET"
