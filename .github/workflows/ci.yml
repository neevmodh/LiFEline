name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.17"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend tests (SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nidhi
          POSTGRES_PASSWORD: nidhi
          POSTGRES_DB: nidhi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nidhi" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - name: Tests on SQLite
        run: uv run pytest
      - name: Tests on PostgreSQL
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://nidhi:nidhi@localhost:5432/nidhi_test

  web:
    name: Web (landing and GEDA console) lint, types, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile app types and web export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export -p web
        env:
          CI: "1"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # Chromium only, without apt: the runner image already has its libraries, and apt mirrors
      # going down must not stop the test suite.
      - run: npx playwright install chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Create a GEDA admin
        run: docker compose exec -T -e LIFELINE_ADMIN_PASSWORD=ci-admin-pass api python -m app.create_admin --email officer@example.com --name "GEDA Officer"
      - name: Smoke test (real sign-up, no sample data)
        run: |
          curl -fsS http://localhost:8000/api/health
          curl -fsS http://localhost:8000/api/config | python3 -c 'import sys,json;d=json.load(sys.stdin);assert len(d["sources"])>5,d'
          CITIZEN=$(curl -fsS -X POST http://localhost:8000/api/auth/register -H 'content-type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-pass-1","name":"Smoke Test","district_id":1}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          curl -fsS -X PUT http://localhost:8000/api/household -H "Authorization: Bearer $CITIZEN" -H 'content-type: application/json' \
            -d '{"monthly_kwh":200,"members":3,"lpg_cylinders_per_month":1,"commute_mode":"bus","commute_km_per_day":10,"ac_count":1,"has_geyser":true,"has_washing_machine":true,"has_ev":false,"has_solar":false,"discom":"ugvcl","area":"urban"}' >/dev/null
          curl -fsS -X POST http://localhost:8000/api/actions -H "Authorization: Bearer $CITIZEN" -F action_code=geyser_off >/dev/null
          TOKEN=$(curl -fsS -X POST http://localhost:8000/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"officer@example.com","password":"ci-admin-pass"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          curl -fsS http://localhost:8000/api/admin/overview -H "Authorization: Bearer $TOKEN" | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["citizens"]==1 and d["actions_total"]==1,d;print("citizens:",d["citizens"])'
          curl -fsS -o /dev/null -w "web: %{http_code}\n" http://localhost:3000/login
      - name: Logs on failure
        if: failure()
        run: docker compose logs
