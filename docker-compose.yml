services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecosetu
      POSTGRES_PASSWORD: ecosetu
      POSTGRES_DB: ecosetu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecosetu"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ecosetu:ecosetu@db:5432/ecosetu
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-in-production}
      CORS_ORIGINS: '["http://localhost:3000"]'
      UPLOAD_DIR: /data/uploads
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
