services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nidhi
      POSTGRES_PASSWORD: nidhi
      POSTGRES_DB: nidhi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nidhi"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://nidhi:nidhi@db:5432/nidhi
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-in-production}
      CORS_ORIGINS: '["http://localhost:3000"]'
      UPLOAD_DIR: /data/uploads
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 20
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/login"]
      interval: 5s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
